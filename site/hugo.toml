# ottoquill.com — the public wiki, built from desk's own documents.
#
# content/ is generated by generate.py and is gitignored: method/ and templates/ are
# the source of truth and are never edited here. Pages belonging to the website rather
# than to the method live in pages/ and are committed.
#
# Same stack as the other Hugo sites in ~/git (bitsy-services/wiki, uniteum/docs,
# gyrealm, gargantis, tinarex): hugo-book vendored as a submodule under themes/,
# deployed to Cloudflare Workers static assets.

baseURL = 'https://ottoquill.com/'
languageCode = 'en-gb'
title = 'Otto Quill'
theme = 'hugo-book'

# Agent instructions live beside the content they govern and are not wiki pages.
# Without this Hugo would render method/CLAUDE.md at /method/claude/.
ignoreFiles = ['CLAUDE\.md$']

# A failed relref is a broken link that ships. Fail the build instead.
refLinksErrorLevel = 'ERROR'

enableGitInfo = false
enableEmoji = false

[params]
  description = 'How fictional worlds and stories get made — by humans, and by an AI author with different affordances.'

  BookTheme = 'auto'
  BookToC = true
  BookSection = '/'
  BookSearch = true
  BookComments = false
  BookRepo = 'https://github.com/ottoquill/desk'

[markup]
  [markup.goldmark.renderer]
    # The 269 research entries carry their attribution in <sub> tags, so raw HTML has
    # to render. generate.py escapes the corpus's <placeholder> pseudo-tags first, so
    # nothing else reaches the renderer as markup.
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
  [markup.highlight]
    noClasses = false
